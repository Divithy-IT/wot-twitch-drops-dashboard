[project]
name = "wot-drops-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "sqlalchemy[asyncio]==2.0.42",
  "asyncpg==0.30.0", "alembic==1.16.4", "pydantic-settings==2.10.1",
  "httpx==0.28.1", "cryptography==45.0.6", "argon2-cffi==25.1.0",
  "python-multipart==0.0.20", "itsdangerous==2.2.0", "apscheduler==3.11.0",
  "aiosmtplib==4.0.1", "jinja2==3.1.6"
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.7", "aiosqlite==0.21.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702"]
