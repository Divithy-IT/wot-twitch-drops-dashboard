[unix_http_server]
file=/run/browser/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/browser/supervisord.pid
childlogdir=/run/browser

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/browser/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1364x768x24 -ac -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox-session
environment=DISPLAY=":99",HOME="/home/browser"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:chromium]
command=/usr/bin/google-chrome-stable --no-sandbox --enable-unsafe-swiftshader --user-data-dir=/home/browser/.config/chromium --restore-last-session --no-first-run --password-store=basic --start-maximized https://www.twitch.tv/worldoftanks
environment=DISPLAY=":99",HOME="/home/browser"
autostart=true
autorestart=false
startsecs=5
stopwaitsecs=20
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -localhost -noxdamage
autorestart=true
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
autorestart=true
priority=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:manager]
command=/usr/bin/python3 /opt/browser/manager.py
environment=BROWSER_MANAGER_SECRET="%(ENV_BROWSER_MANAGER_SECRET)s"
autorestart=true
priority=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
