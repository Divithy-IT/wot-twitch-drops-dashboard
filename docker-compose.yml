services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wot}
      POSTGRES_USER: ${POSTGRES_USER:-wot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  app:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:${APP_BIND_PORT:-8766}:8000"]
    networks: [backend]
    restart: unless-stopped
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 30s, timeout: 5s, retries: 3}
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  browser:
    build: {context: browser}
    environment:
      BROWSER_MANAGER_SECRET: ${BROWSER_MANAGER_SECRET:?set BROWSER_MANAGER_SECRET}
    volumes:
      - chromium_profile:/home/browser/.config/chromium
    ports:
      - "127.0.0.1:${BROWSER_BIND_PORT:-8767}:6080"
    networks: [backend]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: {test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"], interval: 30s, timeout: 5s, retries: 3}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
networks:
  backend:
    name: wot-drops-backend
volumes:
  postgres_data:
  chromium_profile:
