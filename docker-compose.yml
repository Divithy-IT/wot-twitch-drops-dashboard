services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wot}
      POSTGRES_USER: ${POSTGRES_USER:-wot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  app:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8765:8000"]
    networks: [backend]
    restart: unless-stopped
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 30s, timeout: 5s, retries: 3}
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
networks:
  backend: {internal: true}
volumes:
  postgres_data:
