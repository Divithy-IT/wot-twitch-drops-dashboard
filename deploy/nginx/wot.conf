# Wklej WEWNĄTRZ istniejącego bloku server dla gry.lemanczyk-it.pl (HTTPS).
# Nie zastępuj całego pliku vhost i nie zmieniaj istniejącego certyfikatu.
location = /wot { return 301 /wot/; }
location ^~ /wot/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /wot;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    client_max_body_size 1m;
}
location ^~ /wot/assets/ {
    proxy_pass http://127.0.0.1:8765/assets/;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
