# Wklej WEWNĄTRZ istniejącego bloku server dla gry.lemanczyk-it.pl (HTTPS).
# Nie zastępuj całego pliku vhost i nie zmieniaj istniejącego certyfikatu.
location = /wot { return 301 /wot/; }
location = /wot/browser { return 301 /wot/browser/; }
location = /_wot_browser_auth {
    internal;
    proxy_pass http://127.0.0.1:8766/api/browser/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Proto https;
}
location ^~ /wot/browser/ {
    auth_request /_wot_browser_auth;
    proxy_pass http://127.0.0.1:8767/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location ^~ /wot/ {
    proxy_pass http://127.0.0.1:8766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /wot;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    client_max_body_size 1m;
}
location ^~ /wot/assets/ {
    proxy_pass http://127.0.0.1:8766/assets/;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
